<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="داشبورد مدیریت اقساط و بدهی‌های ماهانه" />
    <title>مدیریت اقساط</title>
    <script>
      // Pre-paint locale/theme so there is no RTL or dark-mode flash before React mounts.
      try {
        var saved = JSON.parse(localStorage.getItem('finance.data.v1') || 'null')
        var settings = (saved && saved.settings) || {}
        if (settings.lang === 'en') {
          document.documentElement.lang = 'en'
          document.documentElement.dir = 'ltr'
        }
        if (settings.theme === 'dark') document.documentElement.classList.add('dark')
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
